events {
    worker_connections 1024;
}


http {

    include /etc/nginx/mime.types;

    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 50M;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;


# 1. Автоматический редирект с HTTP на HTTPS для ВСЕХ доменов
    server {
        listen 80;
        server_name almarathon.com www.almarathon.com api.almarathon.com n8n.almarathon.com; 
        return 301 https://$host$request_uri;
    }

    # Redirect www.almarathon.com to almarathon.com
    server {
        listen 443 ssl;
        server_name www.almarathon.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://almarathon.com$request_uri;
    }

     # 2.  N8N   Блок для Автоматизации n8n.almarathon.com
    server {
        listen 443 ssl;
        server_name n8n.almarathon.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;


    # n8n открывается сразу в корне поддомена   
        location / {
            proxy_pass http://n8n:5678;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Настройки для WebSocket (чтобы интерфейс n8n не зависал)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
        }
    }


    # 3. Frontend  Блок для Главного сайта и API (almarathon.com)
    server {
        listen 443 ssl;
        server_name almarathon.com;


        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Frontend (React SPA)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

          
        }
        location ~* \.(js|css|png|svg|ico|woff2)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }	
    }

    # Backend API бота
    server {
        listen 443 ssl;
        server_name api.almarathon.com;


        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;


        location / {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;


        }
    }
}
