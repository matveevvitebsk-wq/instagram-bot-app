events {
    worker_connections 1024;
}


http {

    include /etc/nginx/mime.types;

    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 50M;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;


#    server {
#        listen 80;
#        server_name almarathon.com www.almarathon.com api.almarathon.com; 
#        return 301 https://$host$request_uri;
#    }

    # Redirect www.almarathon.com to almarathon.com
#    server {
#        listen 80;
#        server_name www.almarathon.com;

#        return 301 https://almarathon.com$request_uri;
#    }


    # 2. Frontend  Блок для Главного сайта и API (almarathon.com)
    server {
        listen 80;
        server_name almarathon.com;


        # Frontend (React SPA)
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            etag off;
            if_modified_since off;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            # HTML shell must not be cached by Telegram WebView
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location ~* \.(js|css|png|svg|ico|woff2)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 3. Backend API бота
    server {
         listen 80;
         server_name api.almarathon.com;
        location / {
            proxy_pass http://backend:8000;

            limit_req zone=api_limit burst=20 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;


        }
    }
}
